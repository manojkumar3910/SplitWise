version: '3.8'

services:
  api:
    build: .
    container_name: spendwise-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/spendwise
      - JWT_SECRET=spendwise_production_secret_change_me_now
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: spendwise-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
